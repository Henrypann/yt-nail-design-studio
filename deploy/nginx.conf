server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite output assets must exist as real files. Do not mask missing bundles
    # with the SPA fallback, otherwise browsers receive HTML as JavaScript.
    location /assets/ {
        try_files $uri =404;
    }

    location /material-library/ {
        try_files $uri =404;
    }

    # React Router owns application routes such as /login and /design/new.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
