server {
    listen 80;
    server_name _;  # 有域名后替换为实际域名

    root /var/www/nail-studio;
    index index.html;

    # gzip 压缩（主 bundle ~979KB，gzip 后 ~191KB）
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # Vite 产物带内容哈希，长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 素材库 JSON/SVG/PNG：短缓存，便于更新模板后生效
    location /material-library/ {
        expires 1h;
        try_files $uri =404;
    }

    # SPA 回退：React Router 前端路由全部回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
