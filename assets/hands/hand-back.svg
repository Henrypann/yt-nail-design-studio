<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" data-view="back" data-reference="ref-image-1.png">
  <!--
    hand-back.svg · Back 手背张手底图（DEV-PLAN §4.2，对标 ref-image-1.png）
    - 第一人称手背视角：图左 = 左手（L1–L5），图右 = 右手（R1–R5），双手关于 x=600 镜像
    - 细描边（1.5px）+ 平涂肤色（token 引用 skin-base / skin-outline，附回退值）+ 背景透明
    - 指甲区域留空：指甲由 NailSlot 动态渲染（§4.4），锚点见 assets/nail-slots/slots.back.json
    - 右手为左手的镜像 <use>，修改左手路径即双手同步
  -->
  <defs>
    <g id="hand-back-left">
      <!-- 手轮廓：腕底 → 小指外侧 → 四指 → 拇指 → 掌内侧 → 腕底 -->
