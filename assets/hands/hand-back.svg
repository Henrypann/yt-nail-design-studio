               C 212 760 188 660 172 560
               C 162 500 152 460 147 420
               C 140 360 142 300 154 258
               C 160 238 176 238 182 258
               C 194 310 196 360 192 408
               C 190 424 200 426 204 406
               C 208 350 216 220 228 132
               C 233 106 259 106 264 132
               C 274 230 276 320 272 382
               C 271 398 281 400 285 382
               C 290 290 300 170 308 98
               C 312 74 332 74 336 98
               C 346 180 352 290 350 376
               C 349 392 359 392 363 374
               C 368 280 378 190 384 140
               C 388 116 408 116 412 140
               C 420 220 424 320 424 395
               C 424 430 432 452 448 462
               C 472 446 496 408 510 368
               C 516 346 534 344 536 360
               C 536 388 512 436 480 486
               C 448 535 414 585 392 645
               C 374 720 364 790 360 852
               Z"
            fill="var(--skin-base, #F7DED3)" stroke="var(--skin-outline, #D8BBA8)" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- 指节与腕部细纹（极简线稿细节，指甲区域保持留空） -->
      <g fill="none" stroke="var(--skin-outline, #D8BBA8)" stroke-width="1" stroke-linecap="round" opacity="0.55">
        <path d="M 152 340 Q 168 334 186 338"/>
        <path d="M 154 448 Q 170 442 190 446"/>
        <path d="M 226 260 Q 246 254 268 258"/>
        <path d="M 218 420 Q 246 412 274 418"/>
        <path d="M 302 240 Q 322 234 344 238"/>
