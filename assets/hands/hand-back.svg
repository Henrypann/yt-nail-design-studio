        <path d="M 380 260 Q 398 254 418 258"/>
        <path d="M 470 440 Q 486 420 500 396"/>
        <path d="M 240 822 Q 300 814 362 820"/>
      </g>
    </g>
  </defs>
  <use href="#hand-back-left"/>
  <use href="#hand-back-left" transform="translate(1200 0) scale(-1 1)"/>
</svg>
